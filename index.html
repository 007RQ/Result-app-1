<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Трекер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230b0d0e'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%233ddc84' stroke-width='9'/%3E%3C/svg%3E">
<title>Трекер</title>
<style>
:root{--bg:#0b0d0e;--c1:rgba(255,255,255,.055);--c2:rgba(255,255,255,.1);--tx:#f2f4f5;--mu:#8f969b;--g:#3ddc84;--r:#ff7a7a;--v:#a78bfa;--o:#ffb454;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body{background:radial-gradient(120% 50% at 50% -10%,#16281e 0,transparent 65%),var(--bg);overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(var(--sa) + 8px) 16px 96px;-webkit-overflow-scrolling:touch}
.in{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
header{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:8px}
header h1{font-size:22px;margin:0;font-weight:700}
.ib{width:40px;height:40px;border-radius:14px;border:0;background:var(--c1);color:var(--tx);font-size:18px}
.dn{display:flex;align-items:center;gap:6px;flex:1}
.dn div{flex:1;text-align:center;font-weight:600;text-transform:capitalize}
.dn small{display:block;color:var(--mu);font-weight:400;text-transform:none}
.card{background:linear-gradient(160deg,var(--c2),var(--c1));border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hero{display:flex;align-items:center;gap:16px}
.ringw{position:relative;width:132px;height:132px;flex:none}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:9;stroke-linecap:round}
.ringw .pr{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc b{font-size:28px}.rc span{font-size:12px;color:var(--mu)}
.side{flex:1;display:flex;flex-direction:column}.side b{font-size:30px}
small,.mu{color:var(--mu);font-size:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{background:var(--c1);border-radius:20px;padding:12px 10px;text-align:center}
.mc b{font-size:19px;display:block}.mc .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin:8px 0 4px;overflow:hidden}
.mc .bar i{display:block;height:100%;border-radius:3px;transition:width .8s}
h3{margin:18px 4px 8px;font-size:18px}
.catr{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 4px;color:var(--mu);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;background:var(--c1);border-radius:18px;margin-bottom:6px;width:100%;border:0;color:var(--tx);text-align:left;font:inherit}
.row small{display:block}.row b{white-space:nowrap}
.pill{border:0;border-radius:999px;background:var(--c2);color:var(--tx);padding:8px 14px;font:inherit;font-size:14px}
.pill.on{background:var(--g);color:#06210f;font-weight:600}
.seg{display:flex;gap:6px;margin:8px 0}.seg .pill{flex:1;padding:8px 0}
.big{font-size:34px;font-weight:700}
.up{color:var(--g)}.dnc{color:var(--r)}
.empty{color:var(--mu);padding:20px 0;text-align:center;font-size:14px}
.ch{width:100%;height:140px;display:block}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:rgba(255,255,255,.08);transform-origin:bottom;animation:gr .7s cubic-bezier(.2,.8,.2,1)}
.bars i.g{background:var(--g)}.bars i.r{background:var(--r)}.bars i.o{background:var(--o)}
@keyframes gr{from{transform:scaleY(0)}}
.promo{background:linear-gradient(135deg,rgba(61,220,132,.2),rgba(167,139,250,.15))}
.btn{width:100%;border:0;border-radius:18px;padding:15px;font:inherit;font-weight:700;font-size:17px;background:linear-gradient(135deg,#3ddc84,#27b564);color:#05220f;margin-top:10px}
.btn:active,.row:active,.pill:active,.ib:active,.fab:active{transform:scale(.97);opacity:.85}
.btn.dng{background:rgba(255,122,122,.15);color:var(--r)}.btn.sec{background:var(--c2);color:var(--tx)}
nav{display:flex;padding:8px 8px calc(var(--sb) + 6px);background:rgba(16,18,20,.92);border-top:1px solid rgba(255,255,255,.05)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:4px 0;min-height:48px;transition:color .2s}
nav button span{display:block;font-size:22px;line-height:1.2}nav button.on{color:var(--g)}
.fab{position:absolute;right:18px;bottom:calc(76px + var(--sb));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#3ddc84,#27b564);color:#05220f;font-size:30px;box-shadow:0 8px 20px rgba(61,220,132,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:20;display:flex;align-items:flex-end;justify-content:center;transition:background .25s}
.ov.show{background:rgba(0,0,0,.55)}
.sheet{width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;background:#17191b;border-radius:28px 28px 0 0;padding:10px 18px calc(var(--sb) + 18px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ov.show .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--c2);margin:0 auto 10px}
.sh{display:flex;justify-content:space-between;align-items:center}.sh h2{margin:0;font-size:20px}
.x{border:0;background:var(--c2);color:var(--tx);width:34px;height:34px;border-radius:50%}
.fld{display:block;margin:10px 0 0}.fld span{display:block;color:var(--mu);font-size:13px;margin:0 0 4px 4px}
.fld input,.fld select{width:100%;background:var(--c1);border:1px solid transparent;border-radius:14px;padding:13px;color:var(--tx);font:inherit;font-size:17px;min-height:48px;outline:0}
.fld input:focus,.fld select:focus{border-color:rgba(61,220,132,.5)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.chip input{display:none}.chip span{display:block;text-align:center;background:var(--c1);border-radius:16px;padding:10px 0;font-size:12px}
.chip input:checked+span{background:rgba(61,220,132,.25);outline:1.5px solid var(--g)}
.tpl{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.tpl .pill{white-space:nowrap}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--mu)}
.err{color:var(--r);font-size:14px;min-height:18px;margin-top:8px}
.tst{position:fixed;left:16px;right:16px;bottom:calc(86px + var(--sb));max-width:488px;margin:auto;background:#2a2d30;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:30;animation:in .3s}
.tst button{border:0;background:none;color:var(--g);font:inherit;font-weight:700}
.note{font-size:12px;color:var(--mu);margin:2px 4px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div id="app"><div id="main"></div>
<button class="fab" data-act="add" aria-label="Добавить">+</button>
<nav id="nav"></nav></div>
<input type="file" id="imp" accept="application/json" hidden>
<script>
'use strict';
/* ===== Utils ===== */
const $=(s,e=document)=>e.querySelector(s),pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pk=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(k,n)=>{const d=pk(k);d.setDate(d.getDate()+n);return key(d)};
const dn=k=>Math.round(pk(k)/864e5),today=()=>key(new Date());
const hhmm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const r0=n=>Math.round(n),r1=n=>Math.round(n*10)/10,nf=n=>r0(n).toLocaleString('ru-RU');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:NaN};
const dur=m=>Math.floor(m/60)+' ч '+pad(Math.round(m%60))+' мин';
const sg=n=>(n>0?'+':n<0?'−':'')+Math.abs(r1(n));
const inWin=(a,b)=>{const d=new Date(),h=d.getHours()+d.getMinutes()/60;return h>=a&&h<b};
/* ===== Storage (IndexedDB) ===== */
let _db;const DB={open(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('tracker',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
async get(k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}};
const DEF=()=>({v:1,days:{},templates:[],profile:{sex:'m',age:null,height:null,weight:null,goalWeight:null,goalFat:null,startDate:today(),kcal:2300,p:160,f:70,c:250,steps:12000,sleep:480,formula:'mifflin',m1:6,m2:9,e1:20,e2:22}});
let S,day=today(),tab='food',wr='30',lastToday=today();
const persist=()=>DB.set('state',S).catch(()=>toast('Не удалось сохранить данные'));
const commit=()=>{persist();render()};
const D=k=>S.days[k]||(S.days[k]={meals:[],workouts:[]});
const ml=d=>(d&&d.meals)||[],wl=d=>(d&&d.workouts)||[];
/* ===== Math ===== */
const MET={'Силовая':5,'Бег':9.8,'Велосипед':7.5,'Плавание':7,'Другое':4};
const series=f=>Object.keys(S.days).filter(k=>S.days[k][f]!=null).sort().map(k=>[k,S.days[k][f]]);
const weightOn=k=>{const s=series('weight').filter(x=>x[0]<=k);return s.length?s.at(-1)[1]:S.profile.weight};
function BMR(w){const P=S.profile;if(P.formula==='harris')return P.sex==='m'?88.362+13.397*w+4.799*P.height-5.677*P.age:447.593+9.247*w+3.098*P.height-4.33*P.age;
 return 10*w+6.25*P.height-5*P.age+(P.sex==='m'?5:-161)}
/* шаги: длина шага = рост*0.415; чистый расход ходьбы ≈ 0.5 ккал/кг/км (BMR не дублируется) */
const stepsKcal=(n,w)=>w*0.5*(n*S.profile.height*0.415/100/1000);
const workKcal=(t,min,w)=>(MET[t]-1)*w*min/60;
function energy(k){const P=S.profile,d=S.days[k]||{},w=weightOn(k);if(!w||!P.height||!P.age)return null;
 const b=BMR(w),st=d.steps!=null?stepsKcal(d.steps,w):0,wk=wl(d).reduce((a,x)=>a+x.kcal,0);return{b,st,wk,total:b+st+wk}}
const totals=m=>m.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c}),{k:0,p:0,f:0,c:0});
const avgLast=(f,n)=>{const t=today(),v=[];for(let i=0;i<n;i++){const x=(S.days[addD(t,-i)]||{})[f];if(x!=null)v.push(x)}return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
function mavg(s){return s.map(([k,v])=>{const t=dn(k),w=s.filter(([k2])=>{const u=dn(k2);return u<=t&&u>t-7});return[k,w.reduce((a,x)=>a+x[1],0)/w.length]})}
/* ===== UI helpers ===== */
const CATS=[{id:'b',n:'Завтрак',i:'🌅'},{id:'l',n:'Обед',i:'🍲'},{id:'d',n:'Ужин',i:'🌙'},{id:'s',n:'Перекус',i:'🍎'}];
const TABS=[['food','Питание','🍽'],['weight','Вес','⚖️'],['act','Активность','👟'],['sleep','Сон','🌙']];
const F=(l,n,v,t)=>`<label class="fld"><span>${l}</span><input name="${n}" type="${t==='time'||t==='date'?t:'text'}" ${t==='num'?'inputmode="decimal"':''} value="${esc(v)}" autocomplete="off"></label>`;
function ring(p,col){const c=2*Math.PI*52;return`<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" stroke="rgba(255,255,255,.08)"/><circle class="pr" cx="60" cy="60" r="52" stroke="${col}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c*(1-Math.min(p,1))}"/></svg>`}
function lineChart(a,b,col){if(a.length<2)return'<div class="empty">Для графика нужно минимум 2 записи</div>';
 const W=320,H=140,p=16,vs=a.concat(b).map(x=>x[1]),mn=Math.min(...vs),mx=Math.max(...vs),sp=(mx-mn)||1,t0=dn(a[0][0]),t1=dn(a.at(-1)[0]);
 const X=k=>p+(t1===t0?0:(dn(k)-t0)/(t1-t0))*(W-2*p),Y=v=>H-p-(v-mn)/sp*(H-2*p);
 const path=b.map((x,i)=>(i?'L':'M')+X(x[0]).toFixed(1)+' '+Y(x[1]).toFixed(1)).join('');
 return`<svg viewBox="0 0 ${W} ${H}" class="ch"><path d="${path}" pathLength="1" class="draw" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${a.map(x=>`<circle cx="${X(x[0]).toFixed(1)}" cy="${Y(x[1]).toFixed(1)}" r="2.5" fill="#fff" opacity=".4"/>`).join('')}<text x="2" y="10" fill="#8f969b" font-size="10">${r1(mx)}</text><text x="2" y="${H-2}" fill="#8f969b" font-size="10">${r1(mn)}</text></svg>`}
function bars(v,goal,cls){const mx=Math.max(goal||0,1,...v.map(x=>x||0));return`<div class="bars">${v.map(x=>`<i class="${x==null?'':cls(x)}" style="height:${x==null?3:Math.max(4,x/mx*100)}%"></i>`).join('')}</div>`}
const lastDays=n=>Array.from({length:n},(_,i)=>addD(today(),i-n+1));
function toast(msg,undo){const t=document.createElement('div');t.className='tst';t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Отменить</button>':''}`;document.body.appendChild(t);
 const rm=()=>t.remove(),id=setTimeout(rm,5000);if(undo)t.querySelector('button').onclick=()=>{clearTimeout(id);undo();rm()}}
function sheet({title,html,save,del}){const ov=document.createElement('div');ov.className='ov';
 ov.innerHTML=`<form class="sheet" novalidate><div class="grab"></div><div class="sh"><h2>${title}</h2><button type="button" class="x" data-close aria-label="Закрыть">✕</button></div>${html}<div class="err"></div>${save?'<button class="btn" type="submit">Сохранить</button>':''}${del?'<button type="button" class="btn dng" data-del>Удалить</button>':''}</form>`;
 document.body.appendChild(ov);requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('show')));
 const form=ov.firstElementChild;let busy=false;const close=()=>{ov.classList.remove('show');setTimeout(()=>ov.remove(),300)};
 form.onsubmit=e=>{e.preventDefault();if(busy)return;const er=save(Object.fromEntries(new FormData(form)));if(er){$('.err',ov).textContent=er;return}busy=true;close()};
 ov.onclick=e=>{if(e.target===ov||e.target.closest('[data-close]'))close();
  if(e.target.closest('[data-del]')&&!busy){busy=true;del();close()}
  const t=e.target.closest('[data-tpl]');if(t){const x=S.templates[+t.dataset.tpl];['name','k','p','f','c'].forEach(n=>form.elements[n].value=x[n])}};
 return ov}
/* ===== Sheets ===== */
function mealSheet(cat,m){const t=S.templates,h=new Date().getHours();cat=m?m.cat:cat||(h<11?'b':h<16?'l':h<21?'d':'s');
 sheet({title:m?'Изменить приём':'Добавить приём пищи',
 html:`<div class="chips">${CATS.map(c=>`<label class="chip"><input type="radio" name="cat" value="${c.id}" ${c.id===cat?'checked':''}><span>${c.i}<br>${c.n}</span></label>`).join('')}</div>
 ${t.length&&!m?`<div class="tpl">${t.map((x,i)=>`<button type="button" class="pill" data-tpl="${i}">${esc(x.name)}</button>`).join('')}</div>`:''}
 ${F('Название','name',m&&m.name)}${F('Калории, ккал','k',m&&m.k,'num')}
 <div class="g3">${F('Белки, г','p',m&&m.p,'num')}${F('Жиры, г','f',m&&m.f,'num')}${F('Углеводы, г','c',m&&m.c,'num')}</div>
 ${F('Время','time',m?m.time:hhmm(),'time')}${F('Заметка','note',m&&m.note)}
 ${m?'':'<label class="chk"><input type="checkbox" name="tpl"> Сохранить в частые</label>'}`,
 save(v){const name=v.name.trim(),k=num(v.k),o={p:0,f:0,c:0};if(!name)return'Введите название';if(!(k>=0))return'Калории: введите число от 0';
  for(const n of['p','f','c']){if(v[n].trim()==='')continue;o[n]=num(v[n]);if(!(o[n]>=0))return'Проверьте БЖУ: нужны числа от 0'}
  const e={id:m?m.id:Date.now()+Math.random().toString(36).slice(2,6),cat:v.cat,name,k,...o,time:v.time||hhmm(),note:v.note.trim()};
  const d=D(day);if(m)d.meals=ml(d).map(x=>x.id===m.id?e:x);else{d.meals=ml(d).concat(e);if(v.tpl)S.templates.push({name,k,...o})}commit()},
 del:m&&(()=>{const d=D(day),old=m;d.meals=ml(d).filter(x=>x.id!==m.id);commit();toast('Запись удалена',()=>{D(day).meals.push(old);commit()})})})}
function dateF(v){return F('Дата','date',v||today(),'date')}
const okDate=v=>/^\d{4}-\d\d-\d\d$/.test(v)&&v<=today()?'':'Укажите дату (не в будущем)';
function weightSheet(k){const d=S.days[k||today()]||{};sheet({title:'Вес и % жира',html:dateF(k)+F('Вес, кг','w',d.weight,'num')+F('Процент жира (необязательно)','fat',d.fat,'num'),
 save(v){const e=okDate(v.date);if(e)return e;const w=num(v.w),f=v.fat.trim()===''?null:num(v.fat);if(!(w>=20&&w<=400))return'Вес: от 20 до 400 кг';if(f!==null&&!(f>=2&&f<=70))return'Жир: от 2 до 70 %';
  const x=D(v.date);x.weight=w;if(f!==null)x.fat=f;commit()}})}
function stepsSheet(k){const d=S.days[k||today()]||{};sheet({title:'Шаги за день',html:dateF(k)+F('Количество шагов','n',d.steps,'num'),
 save(v){const e=okDate(v.date);if(e)return e;const n=num(v.n);if(!(n>=0&&n<=200000))return'Шаги: число от 0 до 200 000';D(v.date).steps=Math.round(n);commit()}})}
function sleepSheet(k){const m=(S.days[k||today()]||{}).sleep;sheet({title:'Сон',html:dateF(k)+`<div class="g2">${F('Часы','h',m!=null?Math.floor(m/60):'','num')}${F('Минуты','m',m!=null?m%60:'','num')}</div>`,
 save(v){const e=okDate(v.date);if(e)return e;const h=num(v.h||0),mi=num(v.m||0);if(!(h>=0&&mi>=0&&mi<60))return'Часы ≥ 0, минуты 0–59';const t=Math.round(h*60+mi);if(t<=0||t>1440)return'Продолжительность от 1 мин до 24 ч';D(v.date).sleep=t;commit()}})}
function workSheet(w){sheet({title:w?'Тренировка':'Новая тренировка',html:dateF(w?day:day)+`<label class="fld"><span>Тип</span><select name="t">${Object.keys(MET).map(t=>`<option ${w&&w.type===t?'selected':''}>${t}</option>`).join('')}</select></label>`+F('Длительность, мин','min',w&&w.min,'num'),
